[project]
name = "mwamko-ai"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "asyncpg>=0.30.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.23",
    "argon2_cffi",
    "alembic>=1.12.1",
    "psycopg2-binary>=2.9.7",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-dotenv>=1.0.0",
    "aiofiles>=23.2.1",
    "pydantic[email]>=2.11.9",
    "pydantic-settings>=2.10.1",
    "openai>=1.0.0",
    "geopandas",
    "jupyterlab",
    "geoalchemy2",
    "resend"
]

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.30.2",
    "coverage>=7.10.6",
    "ipython<9",
    "mypy>=1.18.1",
    "pdbr[ipython]>=0.9.2",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-mock>=3.15.1",
    "pytest-sugar>=1.1.1",
    "ruff>=0.13.0",
]