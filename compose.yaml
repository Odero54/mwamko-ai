services:
  app:
    build:
      context: .
      target: app
    container_name: mwamko-app
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      PORT: "8000"
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/mwamko"
    depends_on:
      - db

  db:
    image: pgrouting/pgrouting:16-3.5-3.7
    container_name: mwamko-db
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro

volumes:
  postgres_data: